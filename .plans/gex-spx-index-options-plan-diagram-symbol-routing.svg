<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">SPX symbol routing — one input, four provider-specific upstream forms</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#475569">Canonical display / input / cache-key form: bare "SPX" (section 6). Each provider derives its own upstream spelling.</text>

  <!-- user input -->
  <rect x="400" y="80" width="200" height="60" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="500" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#312e81">User types</text>
  <text x="500" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#312e81">"SPX"</text>

  <!-- connector lines -->
  <line x1="500" y1="140" x2="180" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="500" y1="140" x2="440" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="500" y1="140" x2="680" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="500" y1="140" x2="900" y2="200" stroke="#94a3b8" stroke-width="2"/>

  <!-- CACHE -->
  <rect x="40" y="200" width="220" height="150" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="150" y="226" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">CACHE</text>
  <text x="150" y="248" text-anchor="middle" font-size="12" fill="#065f46">upstream form: "SPX"</text>
  <text x="150" y="266" text-anchor="middle" font-size="11" fill="#065f46">(bare — no prefix)</text>
  <text x="150" y="290" text-anchor="middle" font-size="11" fill="#065f46">data/options/SPX.json</text>
  <text x="150" y="306" text-anchor="middle" font-size="11" fill="#065f46">built via yfinance "^SPX"</text>
  <text x="150" y="322" text-anchor="middle" font-size="11" fill="#065f46">+ Cboe "_SPX" greeks</text>
  <rect x="60" y="332" width="180" height="8" fill="#10b981"/>
  <text x="150" y="345" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">WORKS TODAY</text>

  <!-- CBOE -->
  <rect x="330" y="200" width="220" height="150" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="440" y="226" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">CBOE (live)</text>
  <text x="440" y="248" text-anchor="middle" font-size="12" fill="#065f46">upstream form: "_SPX"</text>
  <text x="440" y="266" text-anchor="middle" font-size="11" fill="#065f46">(underscore prefix)</text>
  <text x="440" y="290" text-anchor="middle" font-size="11" fill="#065f46">cdn.cboe.com/.../</text>
  <text x="440" y="306" text-anchor="middle" font-size="11" fill="#065f46">delayed_quotes/options/</text>
  <text x="440" y="322" text-anchor="middle" font-size="11" fill="#065f46">_SPX.json (verified: HTTP 200)</text>
  <rect x="350" y="332" width="180" height="8" fill="#10b981"/>
  <text x="440" y="345" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">WORKS TODAY</text>

  <!-- YAHOO -->
  <rect x="570" y="200" width="220" height="150" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="680" y="226" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">YAHOO (live)</text>
  <text x="680" y="248" text-anchor="middle" font-size="12" fill="#92400e">upstream form: "^SPX"</text>
  <text x="680" y="266" text-anchor="middle" font-size="11" fill="#92400e">(caret prefix)</text>
  <text x="680" y="290" text-anchor="middle" font-size="11" fill="#92400e">bug: yahooProvider never</text>
  <text x="680" y="306" text-anchor="middle" font-size="11" fill="#92400e">adds "^" -&gt; empty result[]</text>
  <text x="680" y="322" text-anchor="middle" font-size="11" fill="#92400e">(main.tsx, section 7.5)</text>
  <rect x="590" y="332" width="180" height="8" fill="#f59e0b"/>
  <text x="680" y="345" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">NEEDS FIX</text>

  <!-- NASDAQ -->
  <rect x="820" y="200" width="220" height="150" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="930" y="226" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">NASDAQ (live)</text>
  <text x="930" y="248" text-anchor="middle" font-size="12" fill="#991b1b">no valid upstream form</text>
  <text x="930" y="266" text-anchor="middle" font-size="11" fill="#991b1b">screener has no concept</text>
  <text x="930" y="290" text-anchor="middle" font-size="11" fill="#991b1b">of indices at all — all</text>
  <text x="930" y="306" text-anchor="middle" font-size="11" fill="#991b1b">assetclass values return</text>
  <text x="930" y="322" text-anchor="middle" font-size="11" fill="#991b1b">"Symbol not exists."</text>
  <rect x="840" y="332" width="180" height="8" fill="#ef4444"/>
  <text x="930" y="345" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">UNSUPPORTED BY DESIGN</text>

  <!-- legend / notes -->
  <rect x="40" y="400" width="1000" height="1" fill="#e2e8f0"/>
  <text x="500" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">v1 scope: SPX only. VIX is explicitly excluded (futures-priced, not spot-priced — see section 5.7).</text>
  <text x="500" y="452" text-anchor="middle" font-size="12" fill="#475569">Fixes needed (section 7): YAHOO gets a "^" prefix + dividend-yield constant for greeks; NASDAQ gets an explicit early error;</text>
  <text x="500" y="470" text-anchor="middle" font-size="12" fill="#475569">both proxies get a one-line isTickerLike() regex fix so Yahoo's own "^SPX" suggestion isn't silently dropped.</text>

  <rect x="40" y="500" width="24" height="16" fill="#10b981"/>
  <text x="72" y="513" font-size="12" fill="#0f172a">already works, verified live</text>
  <rect x="330" y="500" width="24" height="16" fill="#f59e0b"/>
  <text x="362" y="513" font-size="12" fill="#0f172a">small, localized fix needed</text>
  <rect x="620" y="500" width="24" height="16" fill="#ef4444"/>
  <text x="652" y="513" font-size="12" fill="#0f172a">unsupported by design (not a bug)</text>

  <text x="500" y="580" text-anchor="middle" font-size="11" fill="#94a3b8">Illustrative routing diagram — see gex-spx-index-options-plan.txt sections 5-7 for the authoritative, file:line-referenced spec.</text>
</svg>
