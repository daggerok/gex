name: 'uv setup'
description: 'Shared setup for python uv'
inputs:
  enable-cache:
    description: 'Enable caching of the uv cache directory'
    required: false
    default: 'true'
  python-version:
    description: 'Python version to install'
    required: false
    default: '3.13'
runs:
  using: "composite"
  steps:
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: ${{ inputs.enable-cache }}
        python-version: ${{ inputs.python-version }}
