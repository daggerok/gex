name: 'uv setup'
description: 'Shared setup for python uv'
inputs:
  enable-cache:
    description: 'Enable caching of the uv cache directory'
    required: false
    default: 'true'
  python-version:
    description: 'Python version to install'
    required: false
    default: '3.13'
runs:
  using: "composite"
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: ${{ inputs.enable-cache }}
        python-version: ${{ inputs.python-version }}
