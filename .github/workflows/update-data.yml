# =============================================================================
# GEX — SMART build-time data cache (GitHub Action)
# -----------------------------------------------------------------------------
# INFRASTRUCTURE (not part of the app source). What it does:
#   1. Runs scripts/options-data.ts (Bun, raw Yahoo calls, Cboe greeks overlay) with TICKERS = the list in api/All.txt
#      (about 360 tickers), added on top of the built-in default list (DEFAULT_SYMBOLS). It does NOT pass `all`, so the
#      auto-universe is not discovered. With ROTATE_STALE=500 the same step then refreshes a rotating portion of the
#      other cached files of api/options (about 2,700): the 500 with the oldest `updated` stamp (selectRotation in the
#      script; the list itself is never counted twice; XSP, a cached cash index outside the list, rotates too), with their
#      own 500-write budget and the same pacing; the chart pass gives the rotated tickers their candles. So every file is refreshed within about 6 weeks; until then it keeps the data of the run that
#      last wrote it (its `updated` field says when).
#      The cash indices SPX, NDX, DJX and RUT are default tickers, so step 1 refreshes them with the expiration rule
#      (selectDefaultExpirations); the former separate api/Indices.txt step was removed on 2026-10-26.
#   2. Commits the fresh api/options/*.json and api/charts/*.json back to the repo and starts the Pages deploy.
# The site (GitHub Pages) then reads its OWN api/options/*.json through the app's CACHE provider (used whenever no local
# proxy is found) - zero CORS issues, zero exposed keys.
#
# SETUP:
#   - Commit this repo with Pages enabled (Settings → Pages).
#   - The ticker list is api/All.txt; tune the env vars in the job below.
#   - Ensure Actions has write permission: Settings → Actions → General →
#     Workflow permissions → "Read and write permissions".
#
# CADENCE: once a week (Saturday 10:00 New York time) for every ticker of api/All.txt plus the
# ROTATE_STALE portion of the rest, or by hand from the Actions tab. The default tickers are refreshed every hour on weekdays
# by update-partial-data.yml, which keeps their later expirations; this run refreshes the far expirations' Yahoo prices.
# =============================================================================
name: Update options data

on:
  schedule:
    # Once a week, Saturday 10:00 New York time (the schedule has its own time zone, the owner's fix 2026-10-12, so summer and
    # winter time need nothing extra): the market is closed, the hourly partial refresh (update-partial-data.yml) does not
    # run, so the two never overlap.
    - cron: "0 10 * * 6"
      timezone: America/New_York
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write # needed to commit the refreshed JSON
  actions: write # needed to start the Pages deploy after a commit

# One data refresh at a time, shared with update-partial-data.yml (a run waits, none is cancelled)
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # The steps below pass a fixed list (TICKERS), so the script does not discover a universe here; UNIVERSE_SIZE and
      # MIN_MARKET_CAP only matter for a manual `all` run. Only files written after Friday 20:00 New York time count as
      # fresh and are skipped until Sunday 18:00 (isFreshAt, the weekend window); on any other day every queued file is fetched.
      MAX_FETCHES: "500"          # writes per step for the fixed list (the rotation brings its own budget)
      UNIVERSE_SIZE: "5000"       # `all` runs only: the market-cap-ranked US universe considered
      MIN_MARKET_CAP: "9000000"   # `all` runs only: microcap floor ($9M); drops nano-caps
      MAX_EXPIRATIONS: "50"       # expirations stored per NON-default ticker; the defaults keep theirs by rule (selectDefaultExpirations)
      REQUEST_SLEEP: "0.5"        # politeness delay between fetches (seconds)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2          # The refresh only needs the current tree and a minimal history for its push.

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.x" # pinned minor: a new Bun release must not break the data runs unattended

      # ROTATE_STALE: after the list, the 500 oldest other cached tickers (own budget of 500 writes, same pacing)
      - name: Fetch option chains
        env:
          ROTATE_STALE: "500"
        run: TICKERS=$(cat api/All.txt) bun scripts/options-data.ts

      - name: Commit updated data
        id: commit
        run: |
          git config user.name  "Maksim Kostromin"
          git config user.email "daggerok@gmail.com"
          # Stage the refreshed chains + api/options/index.json (which also holds the
          # no-options skiplist under the `no_options` key since options-data v9).
          git add api/ || true
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "chore(data): refresh option chains [skip ci]"
            if git push; then echo "pushed=true" >> "$GITHUB_OUTPUT"; else echo "Push failed (may be up-to-date or race condition)"; fi
          fi

      # Deploy the site only when this run pushed new data: no commit, no Pages run (saves the minute a deploy costs).
      # GITHUB_TOKEN pushes do not start other workflows, so the deploy is requested explicitly.
      - name: Deploy the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run github-pages.yml --ref "${GITHUB_REF_NAME}"
