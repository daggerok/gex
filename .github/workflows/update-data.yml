# =============================================================================
# GEX — SMART build-time data cache (GitHub Action)
# -----------------------------------------------------------------------------
# INFRASTRUCTURE (not part of the 3-file app source). Implements the
# "GitHub Actions build-time caching" strategy:
#   1. Runs scripts/options-data.ts (Bun, raw Yahoo calls) on a schedule.
#   2. The script SELF-DISCOVERS a market-cap-ranked US universe, then (v4) works
#      COVERAGE-FIRST: it fetches every MISSING ticker down the cap-ranked list
#      (resuming where the last run stopped), and only once nothing is missing
#      does it ROTATE-REFRESH the OLDEST cached files first. It skips files still
#      fresh today and stops at its budget or when the source rate-limits it.
#      Each run does NEW work; the next run resumes — so we cache ALL tickers
#      before re-looping, and never re-loop only the top-cap names.
#   3. Fetches index option chains (api/Indices.txt, e.g. SPX, NDX) in a SEPARATE
#      step with a smaller MAX_EXPIRATIONS / MAX_FETCHES budget, so large index
#      chains stay bounded in size and never eat into the equity budget.
#   4. Commits the fresh api/options/*.json back to the repo.
# The site (GitHub Pages) then reads its OWN api/options/*.json via the app's
# "Static cache" provider — zero CORS issues, zero exposed keys.
#
# SETUP:
#   - Commit this repo with Pages enabled (Settings → Pages).
#   - No ticker list to maintain — tune the env vars in the job below.
#   - Ensure Actions has write permission: Settings → Actions → General →
#     Workflow permissions → "Read and write permissions".
#
# CADENCE: once a week (Saturday 10:00 New York time) for every ticker of api/All.txt and api/Indices.txt, or by hand from the
# Actions tab. The default tickers are refreshed every hour on weekdays by update-partial-data.yml, which keeps their
# later expirations; this full run is what refreshes everything else (the far expirations' Yahoo prices included).
# =============================================================================
name: Update options data

on:
  schedule:
    # Once a week, Saturday 10:00 New York time (the schedule has its own time zone, the owner's fix 2026-10-12, so summer and
    # winter time need nothing extra): the market is closed, the hourly partial refresh (update-partial-data.yml) does not
    # run, so the two never overlap.
    - cron: "0 10 * * 6"
      timezone: America/New_York
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write # needed to commit the refreshed JSON
  actions: write # needed to start the Pages deploy after a commit

# One data refresh at a time, shared with update-partial-data.yml (a run waits, none is cancelled)
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # SMART, self-driving universe — no hand-maintained ticker list.
      # The script discovers US symbols sorted DESC by market cap (NASDAQ
      # screener), skips files already refreshed today, and fetches top-down
      # until the per-run budget is hit or the source rate-limits us. Each run
      # APPENDS to the cache and the next run resumes where this one stopped.
      MAX_FETCHES: "500"          # NEW (non-skipped) fetches per run (chunk size)
      UNIVERSE_SIZE: "5000"       # consider the FULL market-cap-ranked US universe
      MIN_MARKET_CAP: "9000000"   # Microcap floor ($10M); drops nano-caps
      MAX_EXPIRATIONS: "50"       # expirations stored per NON-default ticker; the defaults keep theirs by rule (selectDefaultExpirations)
      REQUEST_SLEEP: "0.5"        # politeness delay between fetches (seconds)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2          # The refresh only needs the current tree and a minimal history for its push.

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.x" # pinned minor: a new Bun release must not break the data runs unattended

      - name: Fetch option chains
        run: TICKERS=$(cat api/All.txt) bun scripts/options-data.ts

      # Index options (api/Indices.txt: SPX, XSP, NDX, DJX, RUT) run as their OWN
      # step with a smaller expiration cap: an index chain is far larger than an
      # equity's (SPX at MAX_EXPIRATIONS=50 is ~5.4 MB vs ~1.6 MB at 15), and a
      # separate budget means a slow index fetch can never crowd out the equity
      # run above. At 15 expirations all five indices total ~4.3 MB (~0.7 MB
      # gzipped) and fetch in ~15 s. MAX_FETCHES must stay >= the line count of
      # api/Indices.txt, or the last index silently waits for the next run.
      # Indices enter the cache ONLY through this explicit allowlist, never via
      # the script's live universe discovery.
      - name: Fetch index option chains
        env:
          MAX_EXPIRATIONS: "15"
          MAX_FETCHES: "10"
        run: TICKERS=$(cat api/Indices.txt) bun scripts/options-data.ts

      - name: Commit updated data
        id: commit
        run: |
          git config user.name  "Maksim Kostromin"
          git config user.email "daggerok@gmail.com"
          # Stage the refreshed chains + api/options/index.json (which also holds the
          # no-options skiplist under the `no_options` key since options-data v9).
          git add api/ || true
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "chore(data): refresh option chains [skip ci]"
            if git push; then echo "pushed=true" >> "$GITHUB_OUTPUT"; else echo "Push failed (may be up-to-date or race condition)"; fi
          fi

      # Deploy the site only when this run pushed new data: no commit, no Pages run (saves the minute a deploy costs).
      # GITHUB_TOKEN pushes do not start other workflows, so the deploy is requested explicitly.
      - name: Deploy the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run github-pages.yml --ref "${GITHUB_REF_NAME}"
