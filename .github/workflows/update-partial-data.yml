# =============================================================================
# GEX - PARTIAL data update: the most important (default) tickers, every hour during US market hours
# -----------------------------------------------------------------------------
# Runs `bun scripts/options-data.ts` with no arguments, which covers only
# DEFAULT_SYMBOLS (the indices, ETFs and mega caps the ticker search field hints; the list lives in
# scripts/options-data.ts and reaches the app through api/options/index.json `defaults`), not the whole universe.
# The full refresh stays in update-data.yml.
#
# WHEN: Mon-Fri at 9:45 and 16:45 New York time (since 2026-10-26; the hourly slots 8:45 .. 16:45 and 17:15, 18:15, 19:15 run
# on the owner's Mac through `bun run data:setup`, see docs/automations.md "Local data runner"). The schedule has its own time zone (`timezone: America/New_York`, the owner's fix,
# 2026-10-12), so the summer and winter time switch needs no extra UTC slots and no skipped runs. The "Market window" step
# below stays as a guard: it skips a scheduled run that starts before 8:40 or after midnight New York time. GitHub drops
# many scheduled runs and starts others late (review GEX-H7: no archive for 2026-10-13, 10-16 and 10-19, the runs came at
# 16:03 and 18:59); the open end of the window lets a late 16:45 run still be final, the local runner adds the other slots.
# Market holidays are not skipped (the data is simply refreshed with the last prices).
#
# WHAT IS COMMITTED (owner's decision, keeps the repository small): the hourly data is NOT committed. Each run fetches
# the fresh files into its own checkout, builds the site from them and deploys it to GitHub Pages straight from this
# workflow (the `deploy` job), so the site is fresh every hour and git history does not grow by about 2 MB per run.
# Only a FINAL run (any run that starts from 16:30 to 23:59 New York time, owner's decision 2026-10-25) commits: the day's
# archive zip api/history/<YYYY-MM>/<day>.zip (the last state of the day, kept for 14 days) and api/cache.json. Several final
# runs a day are fine: the archive is idempotent, a ticker whose data did not change keeps its zip entry (only the
# `updated` stamp differs), so a later final run commits only what really changed after the close. A backtest backup made
# here (repository variable BACKTEST_TICKERS) is committed by the run that made it. Any other deploy (a code push)
# refreshes the default tickers before it builds, see github-pages.yml, so it never shows the older committed files.
#
# INTENSIVE MODE (off by default), ONE switch: the line `INTENSIVE: "true"` in the env of job `update` below. It is a
# comment by default; uncomment it and push to switch the mode on, comment it again (or write "false" or "") to switch it off.
#   OFF  only the classic runs described above (9:45 and 16:45). The hourly starter slots end in a few seconds.
#   ON   during the trading session (Mon-Fri 9:30 to 16:00 New York time) the workflow runs in a chain: the 9:30 slot starts
#        it, and every run that ends well starts the next one (job `next`: waits INTENSIVE_PAUSE seconds, default 180, then
#        `gh workflow run`), until 16:00. The other starter slots (10:30 .. 15:30) only restart a chain that broke: the
#        concurrency group keeps one run going and one waiting, so there is never a second chain. The classic runs go on
#        as before. Each run of the chain also COMMITS the refreshed api/options, api/charts and api/cache.json
#        (`chore(data): refresh option chains`), and scripts/data-squash.ts folds the data commits at the tip of main into
#        ONE commit when there are SQUASH_AFTER of them one after another (repository variable, default 10, 0 = never)
#        and on every final run (16:30 or later). The squash force-pushes main with --force-with-lease; only data commits
#        at the tip are rewritten, a code commit never changes its hash. README "After a squash of main" tells how a clone
#        follows it. The file api/Minimums.yml (a `tickers:` list) replaces the default ticker list
#        in the intensive runs only; no ticker in it = the default list. Market holidays are not known: the chain runs on a weekday holiday too.
#        Measured 2026-11-26: 24 tickers fetch in 30 to 32 s (the 1 s pause between Cboe requests sets that time),
#        a whole run with build and deploy is about 1.5 min, one data commit is about 3 MB packed.
# A manual run with the `intensive` box ticked is ONE intensive run (commit and squash) at any time, whatever the switch
# says; it continues as a chain only when the switch is on and the session is open.
#
# SPEED: the job is kept as short as possible, it is billed per started minute. The default 27 tickers with every
# expiration of the rule take about 30 s with CONCURRENCY=4, build and deploy are two more short jobs, about 2-3 billed
# minutes a run.
# =============================================================================
name: Update partial options data

on:
  workflow_dispatch: # manual run, always refreshes
    inputs:
      intensive:
        description: "One intensive run: also commit the refreshed data and squash the data commits (see the header)"
        type: boolean
        default: false
  schedule:
    # Rare on purpose (owner, 2026-10-26): the owner's Mac runs every hourly slot (scripts/data-local.ts, launchd), GitHub
    # only a safety net after the open and a final run after the close, in the time zone below, summer and winter alike
    - cron: "45 9,16 * * 1-5" # CLASSIC: 9:45 and 16:45 (final: writes and commits the day zip)
      timezone: America/New_York
    # STARTER of the intensive chain: 9:30 starts it, 10:30 .. 15:30 restart it if it broke. With
    # the switch INTENSIVE off (the default) or outside the session these runs stop at the first step. The job knows this line by its
    # cron text: STARTER_SCHEDULE in the job env must stay equal to it.
    - cron: "30 9-15 * * 1-5"
      timezone: America/New_York

permissions:
  contents: write # the end-of-day archive and a backtest backup are committed; intensive mode: the data and the squash (force-push)
  actions: write # intensive mode: job `next` starts the following run of the chain
  pages: write # the deployment job
  id-token: write # the deployment job

# One data refresh at a time, shared with update-data.yml (a run waits, none is cancelled)
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      run: ${{ steps.window.outputs.run }}
      chain: ${{ steps.window.outputs.chain }}
    env:
      # THE SWITCH of the intensive mode (see the header): uncommented with "true" = on; commented, "false" or "" = off
      # INTENSIVE: "true"
      # The cron text of the starter line above (the intensive chain). Keep the two equal.
      STARTER_SCHEDULE: "30 9-15 * * 1-5"
      # The default tickers keep their expirations by rule (owner, 2026-10-25; scripts/options-data.ts
      # selectDefaultExpirations): every listed date up to 42 days (the dailies), Fridays up to 92 days, monthlies and
      # quarter-ends up to 1 year, no LEAPS. All of them are fetched again each hour (SPX 40, SPY and QQQ 20, a stock
      # 10-17; 27 tickers, about 23 MB of JSON, a 3.4 MB day zip, measured 2026-10-25). MAX_EXPIRATIONS caps only other
      # tickers (TICKERS added on top); KEEP_EXPIRATIONS never keeps for a default what the rule drops.
      MAX_EXPIRATIONS: "15"
      KEEP_EXPIRATIONS: "1"
      # 4 tickers at a time and a short pause: the 27 defaults with every rule expiration took 30 s (measured), no failures
      CONCURRENCY: "4"
      REQUEST_SLEEP: "0.1"
    steps:
      - name: Market window
        id: window
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_INTENSIVE: ${{ inputs.intensive }}
        run: |
          # Minutes since midnight in New York
          now=$(TZ=America/New_York date +%H:%M)
          weekday=$(TZ=America/New_York date +%u) # 1 = Monday .. 7 = Sunday
          mins=$((10#${now%:*} * 60 + 10#${now#*:}))
          run=true
          if [ -n "$SCHEDULE" ]; then
            # accept 8:40 - 23:59: any late start of an after-close slot still writes the day's archive. A run that GitHub
            # starts after midnight would belong to the next day (or a Saturday) and is skipped.
            if [ "$mins" -lt 520 ]; then run=false; fi
          fi
          # a final run: 16:30 New York time or later (to 23:59), it writes and commits the day's archive. Every such run is
          # final, the archive is idempotent (owner, 2026-10-25)
          final=false
          if [ "$mins" -ge 990 ]; then final=true; fi
          # the intensive switch and the trading session (Mon-Fri 9:30 to 16:00)
          enabled=false
          # INTENSIVE comes from the job env (the switch); only "true" switches the mode on
          case "$(printf '%s' "${INTENSIVE:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in true) enabled=true ;; esac
          open=false
          if [ "$weekday" -le 5 ] && [ "$mins" -ge 570 ] && [ "$mins" -lt 960 ]; then open=true; fi
          # chain: this run belongs to the intensive chain and starts the next run when it ends well
          chain=false
          if [ "$enabled" = "true" ] && [ "$open" = "true" ]; then chain=true; fi
          # intensive: commit the refreshed data. The chain, or one manual run with the box ticked
          intensive=$chain
          if [ -z "$SCHEDULE" ] && [ "$MANUAL_INTENSIVE" = "true" ]; then intensive=true; fi
          # squash: whenever the switch is on (so the classic final run after the close folds what the chain left), and for
          # the manual intensive run
          squash=$enabled
          if [ "$intensive" = "true" ]; then squash=true; fi
          # a starter slot has nothing to do unless it starts or restarts the chain
          if [ "$SCHEDULE" = "$STARTER_SCHEDULE" ] && [ "$chain" != "true" ]; then run=false; fi
          echo "New York time $now (weekday $weekday), schedule '${SCHEDULE:-manual}', INTENSIVE=$enabled, session open=$open -> run=$run final=$final intensive=$intensive chain=$chain squash=$squash"
          {
            echo "run=$run"
            echo "final=$final"
            echo "intensive=$intensive"
            echo "squash=$squash"
            if [ "$run" = "true" ]; then echo "chain=$chain"; else echo "chain=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.window.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2
        if: steps.window.outputs.run == 'true'
        with:
          bun-version: "1.4.x" # pinned minor: a new Bun release must not break the data runs unattended

      # HISTORY=1 only for the last run of the day: it writes the day's archive zip (api/history) and deletes the zips
      # older than 14 days. The runs before it leave api/history alone, nothing of them is committed.
      - name: Fetch default option chains
        if: steps.window.outputs.run == 'true'
        env:
          HISTORY: ${{ steps.window.outputs.final == 'true' && '1' || '0' }}
          # rotation of the archive: daily zips and backups made on demand, days kept (repository variables override the 14)
          HISTORY_KEEP_DAYS: ${{ vars.HISTORY_KEEP_DAYS || '14' }}
          HISTORY_KEEP_BACKUP_DAYS: ${{ vars.HISTORY_KEEP_BACKUP_DAYS || '14' }}
          # an intensive run fetches the tickers of api/Minimums.yml (or .yaml: a `tickers:` list, lines commented with # are
          # skipped) instead of the built-in default list; no file or an empty list = the built-in list. Classic runs never read it.
          DEFAULT_TICKERS_FILE: ${{ steps.window.outputs.intensive == 'true' && 'api/Minimums' || '' }}
        run: bun scripts/options-data.ts

      # Backtest backup of the data just fetched, only when the repository variable BACKTEST_TICKERS is set
      # (Settings, Secrets and variables, Actions, Variables): `all` for every available ticker or a list such as
      # `SPY NDX`. It is off by default, a backup of everything every hour adds tens of MB per hour. This one IS committed.
      - name: Backtest backup
        if: steps.window.outputs.run == 'true' && vars.BACKTEST_TICKERS != ''
        env:
          BACKUP_TICKERS: ${{ vars.BACKTEST_TICKERS }}
        run: |
          # the default shell has no pipefail, without it a failing script would be hidden by tee
          set -o pipefail
          # unquoted on purpose: the script splits the list and refuses anything that is not a ticker name
          bun scripts/backtest-backup.ts $BACKUP_TICKERS | tee -a "$GITHUB_STEP_SUMMARY"

      # The site is built from the fresh files of this checkout (not committed) and handed to the deploy job
      - name: Build the site
        if: steps.window.outputs.run == 'true'
        run: |
          bun install -E
          bun run build-github-pages

      - name: Setup Pages
        if: steps.window.outputs.run == 'true'
        uses: actions/configure-pages@v6

      - name: Upload the site
        if: steps.window.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      # Commits only what must stay in git: the day's archive and api/cache.json (last run of the day), a backtest backup
      # (the run that made it). The refreshed api/options and api/charts files are NOT staged. The site is already built, so
      # the working tree may be thrown away when a push has to be replayed. INTENSIVE mode stages the refreshed data too
      # (api/options, api/charts, api/cache.json), so every run leaves one data commit; the next step folds them.
      - name: Commit the archive
        if: steps.window.outputs.run == 'true'
        env:
          FINAL: ${{ steps.window.outputs.final }}
          INTENSIVE: ${{ steps.window.outputs.intensive }}
        run: |
          git config user.name  "Maksim Kostromin"
          git config user.email "daggerok@gmail.com"
          git add api/history || true
          if [ "$FINAL" = "true" ]; then git add api/cache.json || true; fi
          message="chore(data): archive the trading day [skip ci]"
          if [ "$INTENSIVE" = "true" ]; then
            git add api/options api/charts api/cache.json || true
            message="chore(data): refresh option chains [skip ci]"
          fi
          if git diff --staged --quiet; then
            echo "Nothing to archive - nothing to commit."
            exit 0
          fi
          git commit -m "$message"
          git push && exit 0
          # main moved meanwhile (a code merge or the full refresh): replay this one commit on the new tip. The unstaged data
          # files are dropped by the reset, the deploy job already has the built site.
          sha=$(git rev-parse HEAD)
          for attempt in 1 2 3; do
            git fetch --depth=2 origin "${GITHUB_REF_NAME}" \
              && git reset -q --hard "origin/${GITHUB_REF_NAME}" \
              && git cherry-pick -X theirs "$sha" \
              && git push && exit 0
            echo "Push attempt $attempt failed, retrying"
            git cherry-pick --abort 2>/dev/null || true
            sleep 5
          done
          echo "Push failed after 3 attempts" && exit 1

      # INTENSIVE switch on (or one manual intensive run): fold the data commits at the tip of main into one when there are
      # SQUASH_AFTER of them one after another, and on every final run. It rewrites only `chore(data):` commits at the tip
      # and pushes with --force-with-lease, so a commit that lands meanwhile is never lost (the squash is skipped and the
      # next run does it).
      - name: Squash the data commits
        if: steps.window.outputs.run == 'true' && steps.window.outputs.squash == 'true'
        env:
          SQUASH_AFTER: ${{ vars.SQUASH_AFTER || '10' }}
          FINAL: ${{ steps.window.outputs.final }}
        run: |
          # the default shell has no pipefail, without it a failing script would be hidden by tee
          set -o pipefail
          bun scripts/data-squash.ts | tee -a "$GITHUB_STEP_SUMMARY"

  # The intensive chain: when this run ended well and the session is still open, wait INTENSIVE_PAUSE seconds and start the
  # next run. It runs beside the deploy job, so the pause never delays the site. The new run waits in the `data-refresh`
  # group until this one is over. A failed run does not continue the chain: the next starter slot restarts it.
  next:
    needs: update
    if: ${{ needs.update.result == 'success' && needs.update.outputs.chain == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          # seconds between the end of a run and the start of the next one (repository variable, default 180, 0 = at once)
          PAUSE: ${{ vars.INTENSIVE_PAUSE || '180' }}
        run: |
          case "$PAUSE" in
            ''|*[!0-9]*) echo "::error::INTENSIVE_PAUSE must be whole seconds, got '$PAUSE'"; exit 1 ;;
          esac
          if [ "$PAUSE" -gt 1800 ]; then echo "::error::INTENSIVE_PAUSE is at most 1800 seconds, got $PAUSE"; exit 1; fi
          sleep "$PAUSE"
          now=$(TZ=America/New_York date +%H:%M)
          weekday=$(TZ=America/New_York date +%u)
          mins=$((10#${now%:*} * 60 + 10#${now#*:}))
          if [ "$weekday" -le 5 ] && [ "$mins" -ge 570 ] && [ "$mins" -lt 960 ]; then
            gh workflow run update-partial-data.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
            echo "New York time $now: the next run of the chain is started" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "New York time $now: the session is over, the chain ends here" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # Deploys the site the update job built. Shares the `pages` group with github-pages.yml, so a code deploy and this one never overlap.
  deploy:
    needs: update
    if: ${{ !cancelled() && needs.update.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
