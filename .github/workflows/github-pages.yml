name: GitHub Pages

on:
  push:
    branches: [main]
    # A push that only adds or removes archive zips (backtest backups, daily archives) is not deployed: they reach the
    # site with the next deploy of a data run or a code change
    paths-ignore:
      - "api/history/**"
      - "api/latest.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v7
        with:
          # Important for a deploy requested by a data workflow: it may start on an older
          # SHA, then commits refreshed data during the run. Checking out the
          # branch ensures Pages builds the newly pushed data commit, not the
          # upstream run's original SHA.
          ref: main
          # Keep only the latest two default-branch commits; the build needs no deeper history.
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.x" # pinned minor: a new Bun release must not break the data runs unattended
      # The hourly refresh does not commit the default tickers (update-partial-data.yml), so the committed files are older
      # than the site: refresh them before building, so a code deploy never publishes older data. A failure (a rate limit)
      # keeps the committed files and the deploy goes on.
      # The default tickers keep their expirations by rule (scripts/options-data.ts selectDefaultExpirations: every date up
      # to 42 days, Fridays to 92, monthlies and quarter-ends to 1 year); MAX_EXPIRATIONS only caps other tickers.
      - name: Refresh the default tickers
        continue-on-error: true
        env:
          MAX_EXPIRATIONS: "15"
          KEEP_EXPIRATIONS: "1"
          CONCURRENCY: "4"
          REQUEST_SLEEP: "0.1"
        run: bun scripts/options-data.ts
      - run: bun install -E
      # Используем скрипт из вашего package.json
      - run: time bun run build-github-pages
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
