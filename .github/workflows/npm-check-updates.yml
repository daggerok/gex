name: npm-check-updates
# Bumps every dependency in package.json in its own checkout and checks that tests and builds still pass; nothing is pushed.
# Manual, and once a week (owner, 2026-10-26): Sunday 10:00 New York time. A red run means the newest versions break something.
on:
  schedule:
    - cron: "0 10 * * 0"
      timezone: America/New_York
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm-check-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.x" # pinned minor: a new Bun release must not break the data runs unattended
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bunx npm-check-updates -u
      - run: bun install -E # exact versions, like ci.yaml and dependency-updates.yml (package.json pins exact versions)
      - run: bun run test
      - run: bun run build
      - run: bun run clean
      - run: bun run build-github-pages
